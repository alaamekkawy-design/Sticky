<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاونت داون</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cairo', sans-serif;
    gap: 30px;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #c9a84c, #f0d060, #c9a84c);
    color: #fff;
    font-size: 2rem;
    font-weight: 900;
    padding: 14px 60px;
    border-radius: 8px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(201,168,76,0.4);
    text-align: center;
  }

  /* ===== FLIP CLOCK WRAPPER ===== */
  .clock {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #111;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }

  /* ===== FLIP UNIT ===== */
  .flip-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .flip-unit label {
    color: #c9a84c;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .flip-card {
    position: relative;
    width: 120px;
    height: 140px;
    perspective: 600px;
  }

  /* الجزء الثابت العلوي */
  .top, .bottom {
    position: absolute;
    width: 100%;
    height: 50%;
    background: #222;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .top {
    top: 0;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid #000;
    align-items: flex-end;
  }

  .bottom {
    bottom: 0;
    border-radius: 0 0 8px 8px;
    align-items: flex-start;
  }

  .top span, .bottom span {
    font-size: 5.5rem;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-family: 'Arial Black', 'Cairo', sans-serif;
  }

  .top span {
    transform: translateY(50%);
  }

  .bottom span {
    transform: translateY(-50%);
  }

  /* الورقة المتحركة الأمامية */
  .flip-front, .flip-back {
    position: absolute;
    width: 100%;
    height: 50%;
    background: #2a2a2a;
    overflow: hidden;
    display: flex;
    justify-content: center;
    backface-visibility: hidden;
    transform-origin: bottom center;
  }

  .flip-front {
    top: 0;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid #000;
    align-items: flex-end;
    transform: rotateX(0deg);
    z-index: 2;
  }

  .flip-back {
    top: 0;
    border-radius: 8px 8px 0 0;
    border-bottom: 2px solid #000;
    align-items: flex-end;
    transform: rotateX(90deg);
    z-index: 1;
    background: #1e1e1e;
  }

  .flip-front span, .flip-back span {
    font-size: 5.5rem;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transform: translateY(50%);
    font-family: 'Arial Black', 'Cairo', sans-serif;
  }

  /* الأنيميشن */
  @keyframes flipTop {
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }
  @keyframes flipBottom {
    0%   { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .flip-front.animate {
    animation: flipTop 0.3s ease-in forwards;
  }

  /* الجزء السفلي المتحرك */
  .flip-bottom-card {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: #1e1e1e;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    backface-visibility: hidden;
    transform: rotateX(90deg);
    transform-origin: top center;
    z-index: 3;
  }

  .flip-bottom-card span {
    font-size: 5.5rem;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transform: translateY(-50%);
    font-family: 'Arial Black', 'Cairo', sans-serif;
  }

  .flip-bottom-card.animate {
    animation: flipBottom 0.3s ease-out 0.3s forwards;
  }

  /* الفاصل */
  .separator {
    font-size: 5rem;
    font-weight: 900;
    color: #c9a84c;
    line-height: 1;
    padding-bottom: 30px;
    text-shadow: 0 0 10px rgba(201,168,76,0.5);
  }

  /* ===== INPUT PANEL ===== */
  .input-panel {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #222;
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    flex-wrap: wrap;
    justify-content: center;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .input-group label {
    color: #c9a84c;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .input-group input {
    width: 80px;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    font-family: 'Cairo', sans-serif;
    background: #111;
    color: #fff;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 8px 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: #c9a84c;
  }

  .input-sep {
    font-size: 1.8rem;
    color: #555;
    font-weight: 900;
    padding-top: 18px;
  }

  /* ===== BUTTONS ===== */
  .btn-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .btn-start {
    background: linear-gradient(135deg, #c9a84c, #f0d060);
    color: #111;
  }

  .btn-start:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(201,168,76,0.5); }

  .btn-pause {
    background: #333;
    color: #fff;
    border: 2px solid #555;
  }

  .btn-pause:hover { background: #444; }

  .btn-reset {
    background: transparent;
    color: #888;
    border: 2px solid #444;
  }

  .btn-reset:hover { color: #fff; border-color: #888; }

  /* ===== FINISHED ===== */
  .finished-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .finished-overlay.show { display: flex; }

  .finished-text {
    font-size: 3rem;
    font-weight: 900;
    color: #c9a84c;
    text-shadow: 0 0 30px rgba(201,168,76,0.8);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .finished-overlay .btn-start {
    font-size: 1.1rem;
    padding: 14px 40px;
  }
</style>
</head>
<body>

<div class="header">كاونت داون</div>

<!-- FLIP CLOCK -->
<div class="clock">
  <!-- Hours -->
  <div class="flip-unit">
    <div class="flip-card" id="fc-hours">
      <div class="top"><span id="top-h">00</span></div>
      <div class="bottom"><span id="bot-h">00</span></div>
      <div class="flip-front" id="ff-h"><span id="ff-h-num">00</span></div>
      <div class="flip-bottom-card" id="fb-h"><span id="fb-h-num">00</span></div>
    </div>
    <label>ساعة</label>
  </div>

  <div class="separator">:</div>

  <!-- Minutes -->
  <div class="flip-unit">
    <div class="flip-card" id="fc-minutes">
      <div class="top"><span id="top-m">00</span></div>
      <div class="bottom"><span id="bot-m">00</span></div>
      <div class="flip-front" id="ff-m"><span id="ff-m-num">00</span></div>
      <div class="flip-bottom-card" id="fb-m"><span id="fb-m-num">00</span></div>
    </div>
    <label>دقيقة</label>
  </div>

  <div class="separator">:</div>

  <!-- Seconds -->
  <div class="flip-unit">
    <div class="flip-card" id="fc-seconds">
      <div class="top"><span id="top-s">00</span></div>
      <div class="bottom"><span id="bot-s">00</span></div>
      <div class="flip-front" id="ff-s"><span id="ff-s-num">00</span></div>
      <div class="flip-bottom-card" id="fb-s"><span id="fb-s-num">00</span></div>
    </div>
    <label>ثانية</label>
  </div>
</div>

<!-- INPUT PANEL -->
<div class="input-panel">
  <div class="input-group">
    <label>ساعة</label>
    <input type="number" id="inp-h" min="0" max="99" value="0" placeholder="00">
  </div>
  <div class="input-sep">:</div>
  <div class="input-group">
    <label>دقيقة</label>
    <input type="number" id="inp-m" min="0" max="59" value="5" placeholder="00">
  </div>
  <div class="input-sep">:</div>
  <div class="input-group">
    <label>ثانية</label>
    <input type="number" id="inp-s" min="0" max="59" value="0" placeholder="00">
  </div>
</div>

<div class="btn-group">
  <button class="btn btn-start" id="btn-start">▶ ابدأ</button>
  <button class="btn btn-pause" id="btn-pause" style="display:none">⏸ إيقاف</button>
  <button class="btn btn-reset" id="btn-reset">↺ إعادة</button>
</div>

<!-- FINISHED -->
<div class="finished-overlay" id="finished">
  <div class="finished-text">⏰ انتهى الوقت!</div>
  <button class="btn btn-start" onclick="resetAll()">إعادة تشغيل</button>
</div>

<script>
  let totalSeconds = 0;
  let remaining = 0;
  let timer = null;
  let running = false;

  // ===== FLIP LOGIC =====
  const units = {
    h: { top: document.getElementById('top-h'), bot: document.getElementById('bot-h'), ffEl: document.getElementById('ff-h'), fbEl: document.getElementById('fb-h'), ffNum: document.getElementById('ff-h-num'), fbNum: document.getElementById('fb-h-num') },
    m: { top: document.getElementById('top-m'), bot: document.getElementById('bot-m'), ffEl: document.getElementById('ff-m'), fbEl: document.getElementById('fb-m'), ffNum: document.getElementById('ff-m-num'), fbNum: document.getElementById('fb-m-num') },
    s: { top: document.getElementById('top-s'), bot: document.getElementById('bot-s'), ffEl: document.getElementById('ff-s'), fbEl: document.getElementById('fb-s'), ffNum: document.getElementById('ff-s-num'), fbNum: document.getElementById('fb-s-num') },
  };

  let prevValues = { h: -1, m: -1, s: -1 };

  function pad(n) { return String(n).padStart(2, '0'); }

  function setUnit(key, val) {
    const u = units[key];
    const str = pad(val);
    // just set static (no flip needed for init)
    u.top.textContent = str;
    u.bot.textContent = str;
    u.ffNum.textContent = str;
    u.fbNum.textContent = str;
    prevValues[key] = val;
  }

  function flipUnit(key, newVal) {
    if (prevValues[key] === newVal) return;
    const u = units[key];
    const oldStr = pad(prevValues[key]);
    const newStr = pad(newVal);

    // setup
    u.top.textContent = oldStr;       // static top shows old
    u.bot.textContent = newStr;       // static bottom shows new
    u.ffNum.textContent = oldStr;     // front flap = old (will rotate away)
    u.fbNum.textContent = newStr;     // back flap = new (will rotate in)

    // reset animations
    u.ffEl.classList.remove('animate');
    u.fbEl.classList.remove('animate');
    void u.ffEl.offsetWidth; // reflow
    void u.fbEl.offsetWidth;

    u.ffEl.classList.add('animate');
    u.fbEl.classList.add('animate');

    // after animation: update top to new
    setTimeout(() => {
      u.top.textContent = newStr;
      u.ffNum.textContent = newStr;
      u.ffEl.classList.remove('animate');
      u.fbEl.classList.remove('animate');
    }, 650);

    prevValues[key] = newVal;
  }

  function displayTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;

    if (prevValues.h !== h) flipUnit('h', h);
    if (prevValues.m !== m) flipUnit('m', m);
    if (prevValues.s !== s) flipUnit('s', s);
  }

  function initDisplay(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    setUnit('h', h);
    setUnit('m', m);
    setUnit('s', s);
  }

  // ===== CONTROLS =====
  document.getElementById('btn-start').addEventListener('click', () => {
    if (running) return;

    const h = parseInt(document.getElementById('inp-h').value) || 0;
    const m = parseInt(document.getElementById('inp-m').value) || 0;
    const s = parseInt(document.getElementById('inp-s').value) || 0;
    totalSeconds = h * 3600 + m * 60 + s;

    if (totalSeconds <= 0) return;

    remaining = totalSeconds;
    initDisplay(remaining);
    running = true;

    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-pause').style.display = 'inline-block';

    timer = setInterval(() => {
      remaining--;
      displayTime(remaining);
      if (remaining <= 0) {
        clearInterval(timer);
        running = false;
        playBell();
        document.getElementById('finished').classList.add('show');
        document.getElementById('btn-pause').style.display = 'none';
        document.getElementById('btn-start').style.display = 'inline-block';
      }
    }, 1000);
  });

  document.getElementById('btn-pause').addEventListener('click', () => {
    if (!running) return;
    clearInterval(timer);
    running = false;
    document.getElementById('btn-pause').textContent = '▶ استمرار';
    document.getElementById('btn-pause').onclick = resumeTimer;
  });

  function resumeTimer() {
    if (running) return;
    running = true;
    document.getElementById('btn-pause').textContent = '⏸ إيقاف';
    document.getElementById('btn-pause').onclick = null;
    document.getElementById('btn-pause').addEventListener('click', pauseAgain);

    timer = setInterval(() => {
      remaining--;
      displayTime(remaining);
      if (remaining <= 0) {
        clearInterval(timer);
        running = false;
        playBell();
        document.getElementById('finished').classList.add('show');
        document.getElementById('btn-pause').style.display = 'none';
        document.getElementById('btn-start').style.display = 'inline-block';
      }
    }, 1000);
  }

  function pauseAgain() {
    if (!running) return;
    clearInterval(timer);
    running = false;
    document.getElementById('btn-pause').textContent = '▶ استمرار';
    document.getElementById('btn-pause').removeEventListener('click', pauseAgain);
    document.getElementById('btn-pause').onclick = resumeTimer;
  }

  document.getElementById('btn-reset').addEventListener('click', resetAll);

  function resetAll() {
    clearInterval(timer);
    running = false;
    remaining = 0;
    document.getElementById('finished').classList.remove('show');
    document.getElementById('btn-start').style.display = 'inline-block';
    document.getElementById('btn-pause').style.display = 'none';
    document.getElementById('btn-pause').textContent = '⏸ إيقاف';
    document.getElementById('btn-pause').onclick = null;
    initDisplay(0);
    prevValues = { h: 0, m: 0, s: 0 };
  }

  // ===== BELL SOUND (Web Audio API) =====
  function playBell() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function ring(startTime, freq, duration, gain) {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.5, startTime + duration);

      gainNode.gain.setValueAtTime(0, startTime);
      gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // جرس 3 مرات
    const now = ctx.currentTime;
    ring(now,        880, 1.5, 0.6);
    ring(now,       1100, 1.5, 0.3);
    ring(now + 1.8,  880, 1.5, 0.6);
    ring(now + 1.8, 1100, 1.5, 0.3);
    ring(now + 3.6,  880, 2.0, 0.7);
    ring(now + 3.6, 1100, 2.0, 0.35);
  }

  // init
  initDisplay(0);
</script>
</body>
</html>
