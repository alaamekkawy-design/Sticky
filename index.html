<script>
// متغير لتخزين حدث التثبيت لاستخدامه لاحقاً
let deferredPrompt; 
const installBtn = document.getElementById('pwaInstallBtn');

// 1. الاستماع لحدث التثبيت التلقائي من المتصفح
window.addEventListener('beforeinstallprompt', (e) => {
  // منع المتصفح من إظهار نافذة التثبيت الافتراضية فوراً
  e.preventDefault();
  
  // حفظ الحدث في المتغير لكي نقوم باستدعائه عندما يضغط المستخدم على زرنا المخصص
  deferredPrompt = e;
  
  // إظهار زر التثبيت المخصص للمستخدم الآن بعدما تأكدنا أن التطبيق جاهز للتثبيت
  installBtn.style.display = 'block';
  
  console.log("'beforeinstallprompt' Event fired & captured successfully.");
});

// 2. معالجة الضغط على زر التثبيت المخصص
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  
  // إظهار نافذة التثبيت الخاصة بالمتصفح (المنبثقة)
  deferredPrompt.prompt();
  
  // انتظار رد فعل المستخدم (هل وافق على التثبيت أم رفض؟)
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response to install prompt: ${outcome}`);
  
  // تنظيف المتغير لأن الحدث لا يمكن استخدامه سوى مرة واحدة
  deferredPrompt = null;
  
  // إخفاء زر التثبيت مجدداً لأن العملية تمت أو تم التعامل معها
  installBtn.style.display = 'none';
});

// 3. الاستماع لحدث إتمام التثبيت بنجاح (اختياري - مفيد للإحصائيات)
window.addEventListener('appinstalled', (event) => {
  console.log('تطبيق مواقيت الصلاة تم تثبيته بنجاح على الجهاز!');
  // هنا يمكنك إخفاء أي عناصر واجهة مستخدم إضافية متعلقة بالتثبيت
  installBtn.style.display = 'none';
});


	
// ======================== البيانات الأساسية ========================

const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const EN_DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const AR_MONTHS_G = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const EN_MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const AR_MONTHS_SYRIAC = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const AR_MONTHS_H = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const COPTIC_MONTHS = ['توت','بابه','هاتور','كيهك','طوبه','أمشير','برمهات','برموده','بشنس','بؤونه','أبيب','مسرى','النسيء'];

function toAr(n) { return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }

function convertTo12HourFormat(time24) {
  if (!time24 || time24 === '--:--') return '--:--';
  let [hours, minutes] = time24.split(':');
  let h = parseInt(hours);
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${minutes} ${h12}`;
}

function toCoptic(date) {
  let copticYear = date.getFullYear() - 283;
  let copticNewYear = new Date(date.getFullYear(), 8, 11);
  if (date < copticNewYear) {
    copticYear--;
    copticNewYear = new Date(date.getFullYear() - 1, 8, 11);
  }
  const dayDiff = Math.floor((date - copticNewYear) / 86400000);
  const month = Math.floor(dayDiff / 30);
  const day = dayDiff % 30 + 1;
  return { day, month, year: copticYear };
}

let currentDisplayDate = new Date();
let activePickerDate = new Date();
let isLoading = false;
let saveTimer = null;

// ======================== حفظ واستعادة مكان وحجم النافذة ========================
const WINDOW_STORAGE_KEY = 'islamic_calendar_window';

function saveWindowState() {
  try {
    // التحقق من أن النافذة مرئية (ليست مصغرة بالكامل)
    if (window.screenX > -10000 && window.screenY > -10000 && window.outerWidth > 100 && window.outerHeight > 100) {
      const state = {
        x: window.screenX,
        y: window.screenY,
        width: window.outerWidth,
        height: window.outerHeight
      };
      localStorage.setItem(WINDOW_STORAGE_KEY, JSON.stringify(state));
      // تحديث عنوان الصفحة بالأبعاد الحالية اختياري
      document.title = `التقويم الإسلامي - ${state.width}×${state.height}`;
    }
  } catch(e) { console.warn('Could not save window state:', e); }
}

function restoreWindowState() {
  const saved = localStorage.getItem(WINDOW_STORAGE_KEY);
  if (saved) {
    try {
      const state = JSON.parse(saved);
      // التحقق من أن الأبعاد معقولة (أكبر من 300 وأصغر من 2000)
      if (state.width && state.height && state.width > 300 && state.width < 2000 && state.height > 300 && state.height < 2000) {
        // التحقق من عدم خروج النافذة عن حدود الشاشة
        const maxX = window.screen.availWidth - 100;
        const maxY = window.screen.availHeight - 100;
        const x = Math.min(Math.max(state.x, 0), maxX);
        const y = Math.min(Math.max(state.y, 0), maxY);
        
        window.resizeTo(state.width, state.height);
        setTimeout(() => window.moveTo(x, y), 50);
        document.title = `التقويم الإسلامي - ${state.width}×${state.height}`;
        return true;
      }
    } catch(e) { console.warn('Could not restore window state:', e); }
  }
  return false;
}

function initWindowPersistence() {
  // محاولة استعادة الحجم والمكان المحفوظين
  const restored = restoreWindowState();
  
  // إذا لم يكن هناك حجم محفوظ، نضبط حجم أولي مناسب (480×500)
  if (!restored) {
    window.resizeTo(480, 500);
    document.title = 'التقويم الإسلامي - 480×500';
  }
  
  // حفظ الحجم والمكان عند تغيير الحجم أو تحريك النافذة
  window.addEventListener('resize', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveWindowState, 500);
  });
  
  window.addEventListener('move', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveWindowState, 500);
  });
  
  window.addEventListener('beforeunload', saveWindowState);
}

// ======================== دوال API ========================
async function fetchHijriDate(date) {
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  try {
    const resp = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
    const data = await resp.json();
    if(data.code === 200 && data.data) {
      const hij = data.data.hijri;
      return { day: parseInt(hij.day), monthName: hij.month.ar, year: parseInt(hij.year) };
    }
    return null;
  } catch(e) { return null; }
}

async function fetchPrayerTimes(date, city) {
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  
  try {
    const resp = await fetch(`https://api.aladhan.com/v1/timings/${d}-${m}-${y}?latitude=${city.lat}&longitude=${city.lng}&method=5&school=0&midnightMode=1`);
    const data = await resp.json();
    if(data.code === 200 && data.data) {
      const t = data.data.timings;
      return {
        fajr: convertTo12HourFormat(t.Fajr.slice(0,5)),
        sunrise: convertTo12HourFormat(t.Sunrise.slice(0,5)),
        dhuhr: convertTo12HourFormat(t.Dhuhr.slice(0,5)),
        asr: convertTo12HourFormat(t.Asr.slice(0,5)),
        maghrib: convertTo12HourFormat(t.Maghrib.slice(0,5)),
        isha: convertTo12HourFormat(t.Isha.slice(0,5))
      };
    }
    return null;
  } catch(e) { return null; }
}

function updateGregorianDisplay(date) {
  document.getElementById('dayAr').innerText = AR_DAYS[date.getDay()];
  document.getElementById('dayEn').innerText = EN_DAYS[date.getDay()];
  document.getElementById('gregDay').innerText = toAr(date.getDate());
  document.getElementById('gregMonth').innerText = AR_MONTHS_G[date.getMonth()];
  document.getElementById('syriacMonth').innerText = AR_MONTHS_SYRIAC[date.getMonth()];
  document.getElementById('gregYear').innerText = toAr(date.getFullYear());
  document.getElementById('gregLineFull').innerText = `${date.getDate()} ${EN_MONTHS[date.getMonth()]} ${date.getFullYear()}`;
  const cop = toCoptic(date);
  document.getElementById('copticSpan').innerText = `${toAr(cop.day)} ${COPTIC_MONTHS[cop.month % 13]} ${toAr(cop.year)}`;
}

function updateHijriDisplay(hijri) {

startCountdown(data.timings); 
	
async function refreshWidget(targetDate) {
  if(isLoading) return;
  isLoading = true;
  const date = targetDate || currentDisplayDate;
  updateGregorianDisplay(date);
  try {
    const hijri = await fetchHijriDate(date);
    if(hijri) updateHijriDisplay(hijri);
    const allPrayers = await Promise.all(CITIES.map(c => fetchPrayerTimes(date, c)));
    updatePrayerTableDisplay(allPrayers);
  } catch(e) { console.warn(e); }
  isLoading = false;
}

// ======================== منتقي التاريخ ========================
let pickerModal = null;
function openDatePicker() { activePickerDate = new Date(currentDisplayDate); renderPicker(); }
function closePicker() { if(pickerModal) pickerModal.remove(); pickerModal = null; }

function renderPicker() {
  if(pickerModal) pickerModal.remove();
  const overlay = document.createElement('div');
  overlay.className = 'datepicker-overlay';
  const y = activePickerDate.getFullYear(), m = activePickerDate.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let grid = [];
  for(let i=0; i<firstDay; i++) grid.push(null);
  for(let d=1; d<=daysInMonth; d++) grid.push(new Date(y, m, d));
  while(grid.length % 7 !== 0) grid.push(null);
  const weekdays = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  overlay.innerHTML = `
    <div class="datepicker-modal">
      <div class="year-month-control">
        <button id="prevYear">««</button><button id="prevMonth">‹</button>
        <span id="monthYear">${AR_MONTHS_G[m]} ${toAr(y)}</span>
        <button id="nextMonth">›</button><button id="nextYear">»»</button>
      </div>
      <div class="picker-grid" id="pickerGrid"></div>
      <div class="picker-actions">
        <button id="todayBtn">📅 اليوم</button>
        <button id="closeBtn" class="outline">إلغاء</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  pickerModal = overlay;
  
  function buildGrid() {
    const container = document.getElementById('pickerGrid');
    container.innerHTML = '';
    weekdays.forEach(wd => { let d=document.createElement('div'); d.className='picker-weekday'; d.innerText=wd; container.appendChild(d); });
    grid.forEach(dt => {
      let div = document.createElement('div'); div.className = 'picker-day';
      if(!dt) { div.classList.add('empty'); div.innerText = ''; }
      else {
        div.innerText = toAr(dt.getDate());
        if(dt.toDateString() === currentDisplayDate.toDateString()) div.classList.add('selected');
        div.onclick = async () => { currentDisplayDate = new Date(dt); await refreshWidget(currentDisplayDate); closePicker(); };
      }
      container.appendChild(div);
    });
  }
  
  function updateGrid() {
    const ny = activePickerDate.getFullYear(), nm = activePickerDate.getMonth();
    document.getElementById('monthYear').innerText = `${AR_MONTHS_G[nm]} ${toAr(ny)}`;
    const fd = new Date(ny, nm, 1).getDay(), dim = new Date(ny, nm+1, 0).getDate();
    let ng = [];
    for(let i=0; i<fd; i++) ng.push(null);
    for(let d=1; d<=dim; d++) ng.push(new Date(ny, nm, d));
    while(ng.length % 7 !== 0) ng.push(null);
    grid = ng; buildGrid();
  }
  
  document.getElementById('prevMonth').onclick = () => { activePickerDate.setMonth(activePickerDate.getMonth()-1); updateGrid(); };
  document.getElementById('nextMonth').onclick = () => { activePickerDate.setMonth(activePickerDate.getMonth()+1); updateGrid(); };
  document.getElementById('prevYear').onclick = () => { activePickerDate.setFullYear(activePickerDate.getFullYear()-1); updateGrid(); };
  document.getElementById('nextYear').onclick = () => { activePickerDate.setFullYear(activePickerDate.getFullYear()+1); updateGrid(); };
  document.getElementById('todayBtn').onclick = async () => { currentDisplayDate = new Date(); await refreshWidget(currentDisplayDate); closePicker(); };
  document.getElementById('closeBtn').onclick = closePicker;
  overlay.onclick = (e) => { if(e.target === overlay) closePicker(); };
  buildGrid();
}




	// مصفوفة بأسماء الصلوات لترتيب عملية البحث عن الصلاة القادمة
const prayerNames = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
const prayerArabicNames = {
    'Fajr': 'الفجر', 'Sunrise': 'الشروق', 'Dhuhr': 'الظهر', 
    'Asr': 'العصر', 'Maghrib': 'المغرب', 'Isha': 'العشاء'
};

function startCountdown(prayerTimes) {
    // دالة داخلية لتنظيف صيغة الوقت وتحويلها بالكامل لـ 24 ساعة صافية (HH:MM)
    function cleanTime(timeStr) {
        if (!timeStr) return "00:00";
        // تنظيف أي نصوص زائدة مثل (EEST) أو (EET) أو مسافات
        let clean = timeStr.replace(/[^\d:apm\s]/gi, '').trim();
        
        // إذا كانت الصيغة تحتوي على AM أو PM (صيغة 12 ساعة)
        if (clean.toLowerCase().includes('am') || clean.toLowerCase().includes('pm')) {
            let isPM = clean.toLowerCase().includes('pm');
            let timeParts = clean.replace(/(am|pm)/i, '').trim().split(':');
            let hours = parseInt(timeParts[0]);
            let minutes = timeParts[1];
            
            if (isPM && hours < 12) hours += 12;
            if (!isPM && hours === 12) hours = 0;
            
            return `${String(hours).padStart(2, '0')}:${minutes}`;
        }
        
        // إذا كانت صيغة 24 ساعة عادية، نأخذ أول جزءين فقط (الساعة والدقيقة)
        return clean.split(':').slice(0, 2).join(':');
    }

    const prayerNames = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const prayerArabicNames = {
        'Fajr': 'الفجر', 'Sunrise': 'الشروق', 'Dhuhr': 'الظهر', 
        'Asr': 'العصر', 'Maghrib': 'المغرب', 'Isha': 'العشاء'
    };

    // تشغيل العداد وتحديثه كل ثانية
    setInterval(() => {
        const now = new Date();
        let nextPrayerName = '';
        let nextPrayerTime = null;

        for (let name of prayerNames) {
            // تأمين جلب الوقت وتنظيفه تماماً
            const timeString = prayerTimes[name] || prayerTimes.timings?.[name];
            if (!timeString) continue;

            const formattedTime = cleanTime(timeString);
            const [hours, minutes] = formattedTime.split(':');
            
            const prayerDate = new Date(now);
            prayerDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

            if (prayerDate > now) {
                nextPrayerName = name;
                nextPrayerTime = prayerDate;
                break;
            }
        }

        // إذا انتهت صلوات اليوم، ننتقل لفجر اليوم التالي
        if (!nextPrayerTime) {
            nextPrayerName = 'Fajr';
            const timeString = prayerTimes['Fajr'] || prayerTimes.timings?.['Fajr'];
            const formattedTime = cleanTime(timeString);
            const [hours, minutes] = formattedTime.split(':');
            
            nextPrayerTime = new Date(now);
            nextPrayerTime.setDate(now.getDate() + 1);
            nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        }

        const diff = nextPrayerTime - now;
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        // تحديث واجهة الـ HTML
        const titleEl = document.getElementById('next-prayer-title');
        const hEl = document.getElementById('timer-hours');
        const mEl = document.getElementById('timer-minutes');
        const sEl = document.getElementById('timer-seconds');

        if (titleEl) titleEl.innerText = `الصلاة القادمة: ${prayerArabicNames[nextPrayerName]}`;
        if (hEl) hEl.innerText = String(hours).padStart(2, '0');
        if (mEl) mEl.innerText = String(minutes).padStart(2, '0');
        if (sEl) sEl.innerText = String(seconds).padStart(2, '0');

    }, 1000);
}


// ======================== تفعيل الأحداث ========================
function attachEvents() {
  ['dayAr','dayEn','gregBlock','hijriBlock','gregLineFullBlock'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', openDatePicker);
  });
}

// ======================== بدء التشغيل ========================
// أولاً: تهيئة حفظ واستعادة حجم النافذة
initWindowPersistence();

// ثانياً: تفعيل الأحداث وتحميل البيانات
attachEvents();
refreshWidget(new Date());
